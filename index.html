  <section class="grid sm:grid-cols-2 gap-4 mt-4"><div class="bg-white rounded-2xl shadow p-5"><h3 class="font-bold text-emerald-800 mb-2">Visi</h3><p class="text-sm whitespace-pre-line">${E(p.visi||'-')}</p></div><div class="bg-white rounded-2xl shadow p-5"><h3 class="font-bold text-emerald-800 mb-2">Misi</h3><p class="text-sm whitespace-pre-line">${E(p.misi||'-')}</p></div></section>
  <h3 class="font-bold text-emerald-800 mt-6 mb-2">Kelengkapan Berkas</h3><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${STRUKTUR.map(b=>{const it=b.s.flatMap(s=>s.i),n=it.filter(i=>by(S.d.bukti,i[0]).length).length;
  return`<button onclick="goto('${b.k}')" class="bg-white rounded-xl shadow p-4 text-left hover:ring-2 ring-amber-400"><div class="text-xs text-amber-600 font-bold">${b.k}</div><div class="font-semibold text-sm text-emerald-900">${E(b.t)}</div>
  <div class="h-2 bg-amber-100 rounded mt-2"><div class="h-2 bg-emerald-600 rounded" style="width:${n/it.length*100}%"></div></div><div class="text-xs text-slate-500 mt-1">${n}/${it.length} butir terisi</div></button>`}).join('')}</div>
  ${S.pw?`<button onclick="editProfil()" class="mt-5 bg-amber-500 rounded-lg px-4 py-1.5 font-semibold text-sm">✏️ Edit profil</button>`:''}</main>`;
}
const PF=[['nama','Nama madrasah'],['nsm','NSM'],['alamat','Alamat'],['kontak','Kontak (telepon/email)'],['kepala','Nama kepala madrasah'],['nip','NIP kepala madrasah']],PT=[['sambutan','Sambutan kepala madrasah'],['visi','Visi'],['misi','Misi (satu baris per poin)']];
function editProfil(){
  const p=S.p||{},f=([k,l])=>`<label class="text-xs font-semibold">${l}</label><input id="pf_${k}" value="${E(p[k]||'')}" class="w-full border rounded p-1.5 mb-2 text-sm">`,
    a=([k,l])=>`<label class="text-xs font-semibold">${l}</label><textarea id="pf_${k}" rows="3" class="w-full border rounded p-1.5 mb-2 text-sm">${E(p[k]||'')}</textarea>`;
  $('modal').innerHTML=box(`<h3 class="font-bold text-emerald-800 mb-3">Edit Profil Madrasah</h3>${PF.map(f).join('')}<label class="text-xs font-semibold">Logo madrasah (maks 5 MB)</label><input id="pf_logo" type="file" accept="image/*" class="block w-full text-xs mb-2">${p.logoId?`<label class="flex items-center gap-2 text-xs text-red-600 mb-2"><input type="checkbox" id="hp_logo"> Hapus logo saat ini</label>`:''}<label class="text-xs font-semibold">Foto kepala madrasah (maks 5 MB)</label><input id="pf_foto" type="file" accept="image/*" class="block w-full text-xs mb-2">${p.fotoId?`<label class="flex items-center gap-2 text-xs text-red-600 mb-2"><input type="checkbox" id="hp_foto"> Hapus foto kepala madrasah saat ini</label>`:''}${PT.map(a).join('')}
  <div class="flex gap-2"><button onclick="simpanProfil()" class="bg-emerald-700 text-white rounded px-4 py-1.5">Simpan</button><button onclick="tutup()" class="border rounded px-4 py-1.5">Batal</button></div>`,'max-w-lg');
}
function simpanProfil(){run(async()=>{
  const data={};[...PF,...PT].forEach(([k])=>data[k]=$('pf_'+k).value);const f=$('pf_foto').files[0],body={action:'saveProfil',data};
  if(f){if(f.size>5*1048576)throw new Error('Foto maksimal 5 MB');body.file={name:f.name,mime:f.type||'image/jpeg',data:await b64(f)};}
  const lg=$('pf_logo').files[0];if(lg){if(lg.size>5*1048576)throw new Error('Logo maksimal 5 MB');body.logo={name:lg.name,mime:lg.type||'image/png',data:await b64(lg)};}
  const hapus=[];if(!f&&$('hp_foto')&&$('hp_foto').checked)hapus.push('fotoId');if(!lg&&$('hp_logo')&&$('hp_logo').checked)hapus.push('logoId');if(hapus.length)body.hapus=hapus;
  await api(body);tutup();await muatProfil();});}
// ---- halaman berkas per bagian
function berkas(b){
  const it=b.s.flatMap(s=>s.i),n=it.filter(i=>by(S.d.bukti,i[0]).length).length;
  return `<main class="max-w-4xl mx-auto p-4"><button onclick="goto('home')" class="mb-3 inline-flex items-center gap-1 bg-white border border-amber-400 text-emerald-800 rounded-lg px-3 py-1.5 text-sm font-semibold hover:bg-amber-100">← Kembali</button><h2 class="font-bold text-emerald-800 text-lg">${b.k}. ${E(b.t)}</h2><p class="text-xs text-slate-500 mb-3">${n} dari ${it.length} butir sudah memiliki bukti · klik butir untuk membuka berkas</p>
  ${b.s.map(s=>`<details class="bg-white rounded-xl shadow mb-3" open><summary class="cursor-pointer p-3 font-semibold bg-amber-100 rounded-t-xl">${s.k}. ${E(s.t)} <span class="text-xs font-normal text-slate-500">(${s.i.filter(i=>by(S.d.bukti,i[0]).length).length}/${s.i.length})</span></summary>
  ${s.i.map(i=>{const c=by(S.d.bukti,i[0]).length;return`<div onclick="bukaItem('${i[0]}')" class="flex items-start gap-2 p-3 border-t cursor-pointer hover:bg-emerald-50"><span class="text-xs text-slate-400 w-12 shrink-0">${i[0]}</span><span class="flex-1 text-sm">${E(i[1])}</span>
  <span class="text-xs rounded-full px-2 py-0.5 ${c?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-700'}">${c} bukti</span>${by(S.d.komentar,i[0]).length?`<span class="text-xs">💬${by(S.d.komentar,i[0]).length}</span>`:''}</div>`}).join('')}</details>`).join('')}</main>`;
}
function bukaItem(id){
  S.it=id;const up=!!S.pw,it=STRUKTUR.flatMap(b=>b.s.flatMap(s=>s.i)).find(i=>i[0]===id);
  $('modal').innerHTML=box(`<div class="flex justify-between gap-3"><div><div class="text-xs text-amber-600 font-bold">${id}</div><h3 class="font-bold text-emerald-800">${E(it[1])}</h3></div><button onclick="tutup()" class="text-2xl leading-none">×</button></div>
  <h4 class="font-semibold mt-4 mb-1">Berkas & Bukti</h4>
  ${by(S.d.bukti,id).map(x=>`<div class="border rounded-lg p-2 mb-1 text-sm"><div class="flex items-center justify-between gap-2">${x.url?`<a href="${E(x.url)}" target="_blank" class="text-emerald-700 underline break-all">${x.fileId?'📎':'🔗'} ${E(x.nama)}</a>`:`<b class="text-emerald-800">📝 ${E(x.nama)}</b>`}${up?`<button onclick="hapus('${x.id}')" class="text-red-600 text-xs shrink-0">Hapus</button>`:''}</div>${x.teks?`<p class="mt-1 whitespace-pre-line text-slate-700">${E(x.teks)}</p>`:''}</div>`).join('')||'<p class="text-sm text-slate-400">Belum ada bukti.</p>'}
  ${up?`<div class="bg-emerald-50 rounded-lg p-3 mt-2 text-sm"><p class="text-xs text-slate-500 mb-2">Isi salah satu atau lebih: file, link, atau keterangan teks (tidak wajib upload file).</p><input id="bn" placeholder="Nama bukti (opsional)" class="w-full border rounded p-1.5 mb-2"><input id="bf" type="file" class="mb-2 block w-full text-xs"><input id="bl" placeholder="atau tempel link Drive/URL" class="w-full border rounded p-1.5 mb-2"><textarea id="bt" rows="3" placeholder="atau tulis keterangan / beberapa kalimat / paragraf" class="w-full border rounded p-1.5 mb-2"></textarea><button onclick="tambah('${id}')" class="bg-emerald-700 text-white rounded px-4 py-1.5">Simpan bukti</button></div>`:''}
  <h4 class="font-semibold mt-4 mb-1">Komentar Pengawas</h4>
  ${by(S.d.komentar,id).map(k=>`<div class="bg-amber-50 rounded-lg p-2 mb-1 text-sm"><b>${E(k.oleh)}</b> <span class="text-xs text-slate-400">(${new Date(k.waktu).toLocaleString('id-ID')})</span>${up?`<button onclick="hapusKomentar('${k.id}')" class="text-red-600 text-xs ml-2">Hapus</button>`:''}<br>${E(k.teks)}</div>`).join('')||'<p class="text-sm text-slate-400">Belum ada komentar.</p>'}
  <div class="mt-2"><input id="kn" placeholder="Nama pengawas" value="${E(S.nm)}" class="w-full border rounded p-1.5 text-sm mb-2"><div class="flex gap-2"><input id="kt" placeholder="Tulis komentar..." class="flex-1 border rounded p-1.5 text-sm"><button onclick="kirimKomentar('${id}')" class="bg-amber-500 rounded px-3 text-sm font-semibold">Kirim</button></div></div>`);
}
function tambah(id){run(async()=>{
  const f=$('bf').files[0],body={action:'addBukti',itemId:id,nama:$('bn').value.trim(),link:$('bl').value.trim(),teks:$('bt').value.trim()};
  if(f){if(f.size>20*1048576)throw new Error('Ukuran file maksimal 20 MB');body.file={name:f.name,mime:f.type||'application/octet-stream',data:await b64(f)};}
  await api(body);await muat();});}
function hapus(x){if(confirm('Hapus bukti ini?'))run(async()=>{await api({action:'delBukti',id:x});await muat();});}
function kirimKomentar(id){run(async()=>{const nama=$('kn').value.trim();S.nm=nama;localStorage.setItem('pk_nm',nama);await api({action:'komentar',itemId:id,nama,teks:$('kt').value});await muat();});}
function hapusKomentar(x){if(confirm('Hapus komentar ini?'))run(async()=>{await api({action:'delKomentar',id:x});await muat();});}
render();run(muatProfil);run(muat);
if(S.pw)run(async()=>{try{await api({action:'cekPwd'});}catch(e){S.pw='';SS('pk_pw','');render();}});
</script></body></html>
